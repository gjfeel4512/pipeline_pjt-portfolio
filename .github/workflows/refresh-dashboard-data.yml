# .github/workflows/refresh-dashboard-data.yml
#
# AWS S3 Silver/Gold 데이터를 주기적으로 읽어서 frontend/mock/*.json (대시보드가
# 실제로 fetch하는 정적 스냅샷)을 재생성하고, 값이 바뀌었으면 커밋/푸시한다.
# 그 다음 같은 파일을 실제 서빙 중인 CloudFront 대시보드(S3 + CloudFront,
# infra/frontend.tf)의 /mock/ 프리픽스로 동기화하고 CloudFront 캐시를 무효화한다
# (2026-09-03: 정적 자산은 이 워크플로가 안 건드림 - index.html/js/css는 frontend/
# 코드가 바뀔 때만 수동으로 `aws s3 sync frontend/ s3://<bucket>/ --exclude 'mock/*'
# --exclude 'scripts/*' --exclude 'README.md'`로 올리면 됨. 여기선 데이터만 자동화).
#
# 필요한 저장소 Secrets (Settings -> Secrets and variables -> Actions, 저장소 관리자만
# 등록 가능 - repo 소유자나 admin 권한이 있는 팀원이 해줘야 함):
#   AWS_ACCESS_KEY_ID       - 아래 6개 권한이 모두 있어야 함(이 용도 전용 IAM 사용자
#   AWS_SECRET_ACCESS_KEY     추천, 팀 계정 루트/관리자 자격증명을 그대로 넣지 말 것):
#                              1) S3 Silver 버킷: s3:GetObject + s3:ListBucket
#                              2) S3 Gold 버킷: s3:GetObject + s3:ListBucket (gold_video_rank_trend
#                                 직접 읽기용) + s3:PutObject (Athena 쿼리 결과 임시 저장,
#                                 s3://<gold-bucket>/athena-query-results/)
#                              3) Athena/Glue (Gold 3개 버저닝 테이블 조회용, 2026-09 전환):
#                                 athena:StartQueryExecution, athena:GetQueryExecution,
#                                 athena:GetQueryResults, glue:GetTable, glue:GetDatabase,
#                                 glue:GetPartitions
#                              4) S3 프론트엔드 버킷(goldline-dev-frontend-*): s3:PutObject
#                                 + s3:DeleteObject + s3:ListBucket (mock/ 동기화용)
#                              5) CloudFront 배포(EVDHEA0GFHDS3): cloudfront:CreateInvalidation
#                              위 4)/5)는 처음엔 없을 수 있음 - 없으면 배포 스텝만 실패하고
#                              (mock 커밋/푸시는 이미 끝난 뒤라) 데이터는 git엔 반영됨.
#                              3)이 없으면 "Export S3 Silver/Gold" 스텝 자체가 실패함
#                              (Gold 데이터가 전부 이걸로 조회되므로 필수).
# 선택 (기본값이 이미 실제 버킷명/리전/배포ID/DB명과 같아서 안 넣어도 되지만, 나중에
# 바뀌면 코드 수정 없이 여기서만 바꿀 수 있게 Repository variables로 등록 가능):
#   AWS_DEFAULT_REGION, AWS_S3_SILVER_BUCKET, AWS_S3_GOLD_BUCKET, AWS_ATHENA_DATABASE,
#   AWS_ATHENA_OUTPUT_LOCATION, FRONTEND_S3_BUCKET, FRONTEND_CLOUDFRONT_DISTRIBUTION_ID
#
# 참고: 이 리포지토리가 private이라도 워크플로 자체는 그대로 동작한다(Actions는
# private 저장소에서도 무료 티어로 쓸 수 있다 - Pages와는 별개 문제).

name: Refresh dashboard data (S3 Silver/Gold)

on:
  schedule:
    # 4시간마다(매시 정각). Bronze(30분)->Silver(40분)->Gold(50분, infra/gold_athena.tf의
    # gold_compute_athena_schedule "cron(50 */4 * * ? *)") 파이프라인 주기에 맞춘 것 -
    # 원래는 하루 1회였는데, Gold 자체가 4시간마다만 갱신되므로 그보다 더 자주(예: 1시간
    # 마다) 돌려도 대부분은 "변경 없음"으로 끝나기만 하고 최신성은 그대로다. 정각으로
    # 두면 Gold가 갱신되고 최소 1시간 안에는 이 워크플로가 그 결과를 반영한다.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 바로 실행 가능

permissions:
  contents: write  # frontend/mock/*.json 변경분을 이 워크플로가 직접 커밋/푸시하기 위함

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3

      - name: Export S3 Silver/Gold -> outputs/silver_gold_export
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-west-2' }}
          AWS_S3_SILVER_BUCKET: ${{ vars.AWS_S3_SILVER_BUCKET }}
          AWS_S3_GOLD_BUCKET: ${{ vars.AWS_S3_GOLD_BUCKET }}
          AWS_ATHENA_DATABASE: ${{ vars.AWS_ATHENA_DATABASE }}
          AWS_ATHENA_OUTPUT_LOCATION: ${{ vars.AWS_ATHENA_OUTPUT_LOCATION }}
        run: python frontend/scripts/export_s3_for_dashboard.py

      - name: Build frontend/mock/*.json
        run: python frontend/scripts/build_dashboard_data.py

      - name: Commit updated mock data (변경 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frontend/mock; then
            echo "변경 없음 - 커밋 생략"
          else
            git add frontend/mock
            git commit -m "chore: refresh dashboard mock data from S3 Silver/Gold"
            git push
          fi

      - name: Deploy mock data to CloudFront dashboard
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-west-2' }}
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET || 'goldline-dev-frontend-827913617635' }}
          FRONTEND_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID || 'EVDHEA0GFHDS3' }}
        run: |
          aws s3 sync frontend/mock/ "s3://${FRONTEND_S3_BUCKET}/mock/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${FRONTEND_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/mock/*'
