version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goldline_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goldline_network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: goldline_airflow_webserver
    command: webserver
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /pipeline/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_HOME: /pipeline
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/pipeline
      - ./dags:/pipeline/dags
      - ./logs:/pipeline/logs
    ports:
      - "8080:8080"
    networks:
      - goldline_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: goldline_airflow_scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /pipeline/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_HOME: /pipeline
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/pipeline
      - ./dags:/pipeline/dags
      - ./logs:/pipeline/logs
    networks:
      - goldline_network

volumes:
  postgres_data:

networks:
  goldline_network:
    driver: bridge
